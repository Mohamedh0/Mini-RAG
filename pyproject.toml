[project]
name = "mini-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "cohere>=7.2.0",
    "fastapi>=0.142.2",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "motor>=3.7.1",
    "openai>=3.31.0",
    "pydantic>=2.13.5",
    "pydantic-mongo>=3.1.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[project.scripts]
mini-rag = "mini_rag:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
